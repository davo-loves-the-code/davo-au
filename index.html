<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="A little corner of the internet belonging to Davo.">
    <title>Davo</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: system-ui, sans-serif;
        line-height: 1.6;
      }

      body {
        display: grid;
        min-height: 100vh;
        margin: 0;
        place-items: center;
        background: Canvas;
        color: CanvasText;
      }

      main {
        width: min(42rem, calc(100% - 3rem));
        padding-block: 3rem;
      }

      h1 {
        margin: 0;
        font-size: clamp(2.5rem, 10vw, 5rem);
        line-height: 1.1;
      }

      p {
        margin-block: 1rem 0;
        font-size: clamp(1.1rem, 3vw, 1.35rem);
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Hello, I’m Davo.</h1>
      <p>This is my little corner of the internet. More soon.</p>
    </main>
  </body>
</html>
